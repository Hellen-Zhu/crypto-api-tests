# ==========================================
# Pytest Configuration File
# ==========================================
# This file contains pytest-specific configurations for the test framework.
# For runtime environment settings (database, timeouts, etc.), see .env file.

[pytest]
# ==========================================
# Test Discovery
# ==========================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ==========================================
# Allure Report Configuration
# ==========================================
# Default addopts for all test runs
# Note: Individual runs can override these with command-line arguments
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

# Allure report configuration
# Results directory can be overridden by ALLURE_RESULTS_DIR in .env
# Report directory can be overridden by ALLURE_REPORT_DIR in .env

# ==========================================
# Logging Configuration
# ==========================================
# Console logging (pytest's own logging, separate from loguru)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# File logging
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ==========================================
# Custom Markers
# ==========================================
# Register custom markers to avoid warnings
markers =
    smoke: Smoke tests for quick validation
    regression: Full regression test suite
    integration: Integration tests
    unit: Unit tests
    P0: Priority 0 - Critical tests
    P1: Priority 1 - High priority tests
    P2: Priority 2 - Medium priority tests
    P3: Priority 3 - Low priority tests
    slow: Tests that take significant time to execute
    websocket: WebSocket protocol tests
    http: HTTP protocol tests

# ==========================================
# Test Execution Options
# ==========================================
# Stop on first failure (useful for debugging)
# Uncomment to enable:
# addopts = -x

# Show extra test summary info
# addopts = -ra

# Increase verbosity for failures
# addopts = -vv

# ==========================================
# Parallel Execution
# ==========================================
# Set default parallel workers via PYTEST_PARALLEL_WORKERS in .env
# or use command line: python run.py -n 4
# or use: python run.py -n auto

# ==========================================
# Timeout Configuration
# ==========================================
# Prevent tests from hanging indefinitely
# Requires pytest-timeout plugin
# timeout = 300
# timeout_method = thread

# ==========================================
# Warnings
# ==========================================
# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

# ==========================================
# Coverage Configuration (if pytest-cov is installed)
# ==========================================
# Uncomment to enable coverage reporting:
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# ==========================================
# Test Ordering
# ==========================================
# If using pytest-ordering plugin, configure here
# Example: ensure database setup runs first
# [pytest-ordering]
