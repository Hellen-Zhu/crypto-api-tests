[behave]
# Behave配置文件

# 默认格式化器
default_format = pretty

# 步骤定义目录
paths = features

# 步骤实现目录  
steps_dir = steps

# 输出详细信息
show_skipped = false
show_source = true
show_timings = true

# 标签配置
default_tags = -wip

# 日志级别
logging_level = INFO

# 停止条件
stop_on_first_failure = false

# 无特殊报告配置

# 并行执行（暂时禁用）
# processes = 1
